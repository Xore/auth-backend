name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-production
  cancel-in-progress: false

jobs:
  vps:
    runs-on: [self-hosted, linux, x64, honeypot-home]
    environment: production-vps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure dedicated deployment identity
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -m 600 /dev/null "$RUNNER_TEMP/auth-vps-key"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/auth-vps-key"
          install -m 600 /dev/null "$RUNNER_TEMP/auth-vps-known-hosts"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/auth-vps-known-hosts"
      - name: Synchronize and restart auth-backend
        shell: bash
        env:
          AUTH_VPS_HOST: ${{ vars.AUTH_VPS_HOST }}
          AUTH_VPS_USER: ${{ vars.AUTH_VPS_USER }}
          AUTH_INTROSPECTION_TOKEN: ${{ secrets.AUTH_INTROSPECTION_TOKEN }}
        run: |
          vps_host=${AUTH_VPS_HOST:-10.8.0.1}
          vps_user=${AUTH_VPS_USER:-root}
          test -n "$AUTH_INTROSPECTION_TOKEN"
          ssh_options=(
            -i "$RUNNER_TEMP/auth-vps-key"
            -p 2222
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/auth-vps-known-hosts"
          )
          ssh "${ssh_options[@]}" "$vps_user@$vps_host" \
            'install -d -m 750 /opt/auth-backend'
          rsync -az --delete-delay \
            --exclude '.git/' --exclude '.github/' --exclude '.env' \
            --exclude 'auth-backups/' \
            -e "ssh ${ssh_options[*]}" \
            ./ "$vps_user@$vps_host:/opt/auth-backend/"
          printf '%s\n' "$AUTH_INTROSPECTION_TOKEN" |
            ssh "${ssh_options[@]}" "$vps_user@$vps_host" '
              set -eu
              IFS= read -r introspection_token
              cd /opt/auth-backend
              test -f .env
              temporary=$(mktemp .env.XXXXXX)
              grep -v "^AUTH_INTROSPECTION_TOKEN=" .env > "$temporary"
              printf "AUTH_INTROSPECTION_TOKEN=%s\n" "$introspection_token" >> "$temporary"
              chmod 600 "$temporary"
              mv "$temporary" .env
            '
          ssh "${ssh_options[@]}" "$vps_user@$vps_host" 'bash -se' <<'REMOTE'
            set -eu
            cd /opt/auth-backend
            test -f .env
            chmod 600 .env
            docker compose config --quiet
            docker compose up -d --build auth-redis auth-portal
            for attempt in $(seq 1 12); do
              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' auth-portal 2>/dev/null || true)
              [ "$status" = healthy ] && exit 0
              sleep 5
            done
            docker compose ps
            docker compose logs --tail=100 auth-portal
            exit 1
          REMOTE
