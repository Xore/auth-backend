name: Scheduled Security Tests

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-security
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: forward-auth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: forward-auth/go.sum
      - name: Fuzz redirect validation
        run: go test . -run '^$' -fuzz '^FuzzSafeRedirect$' -fuzztime 60s
      - name: Fuzz PASETO parsing
        run: go test . -run '^$' -fuzz '^FuzzParseSessionPASETO$' -fuzztime 60s
