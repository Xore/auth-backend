<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="csrf-token" content="{{.CSRF}}">
<title>xore//auth — app</title>
<link rel="stylesheet" href="/static/theme.css">
<style nonce="{{.Nonce}}">
  .u-mt8{margin-top:8px}.u-mt12{margin-top:12px}.u-mt14{margin-top:14px}
  body{overflow:hidden}
  .modal.modal--permanent{display:flex;opacity:1;visibility:visible;inset:0;width:100vw;height:100dvh;
    max-width:none;max-height:none;transform:none;border:0;border-radius:0}
  .modal.modal--permanent.open{transform:none}
  a.btn{text-decoration:none}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .stat-grid .card{padding:16px;margin-bottom:0}
  .stat__n{font-size:24px;font-weight:700;color:var(--text-primary)}
  .stat__l{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
  .pane__h3{margin-bottom:4px}
  .pane__desc{font-size:13px;color:var(--text-secondary);margin-bottom:16px}
  .filter-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .filter-row .form-input{flex:1;min-width:160px;width:auto}
  .filter-row select.form-input{flex:0 0 auto}
  .newuser{display:grid;grid-template-columns:1fr 110px 1fr auto;gap:10px;align-items:end}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}
  .action-menu{position:relative;display:inline-block}
  .action-menu>summary{list-style:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--border-subtle);border-radius:var(--radius-md);cursor:pointer;color:var(--text-secondary);
    font-size:20px;line-height:1;background:transparent}
  .action-menu>summary::-webkit-details-marker{display:none}
  .action-menu>summary:hover,.action-menu[open]>summary{background:var(--surface-2);color:var(--text-primary)}
  .action-menu__popover{position:absolute;right:0;top:calc(100% + 6px);z-index:20;width:190px;padding:6px;
    background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--radius-md);
    box-shadow:var(--shadow-modal)}
  .action-menu__item{display:block;width:100%;padding:8px 10px;border:0;border-radius:6px;background:transparent;
    color:var(--text-primary);font:inherit;font-size:12px;text-align:left;cursor:pointer;white-space:nowrap}
  .action-menu__item:hover{background:var(--surface-3)}
  .action-menu__item--danger{color:var(--red);border-top:1px solid var(--border-subtle);border-radius:0;margin-top:4px;padding-top:10px}
  .edit-dialog-backdrop{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;
    padding:20px;background:color-mix(in srgb,var(--app-bg) 70%,transparent);backdrop-filter:blur(3px)}
  .edit-dialog-backdrop.open{display:flex}
  .edit-dialog{width:min(520px,100%);background:var(--surface-1);border:1px solid var(--border-strong);
    border-radius:var(--radius-lg);box-shadow:var(--shadow-modal);padding:24px}
  .edit-dialog__title{font-size:18px;font-weight:600;margin:0 0 6px}
  .edit-dialog__desc{font-size:12px;color:var(--text-secondary);line-height:1.5;margin:0 0 18px}
  .edit-dialog__actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .danger-dialog__warning{padding:12px 14px;border:1px solid color-mix(in srgb,var(--danger) 35%,transparent);border-radius:var(--radius-md);
    background:var(--red-subtle);color:var(--text-primary);font-size:12px;line-height:1.55}
  .danger-dialog__warning ul{margin:8px 0 0;padding-left:18px}
  #flash{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:400;display:none;
    background:var(--surface-0);border:1px solid var(--green);border-radius:var(--radius-md);
    padding:14px 20px;font-size:13px;color:var(--text-primary);box-shadow:var(--shadow-modal);
    max-width:90vw;word-break:break-all;text-align:center}
  #flash.err{border-color:var(--red)}
  #flash b{color:var(--green)}
  .cell-mono{font-family:'SF Mono','Fira Code','Cascadia Code',monospace;font-size:11px}
  .cell-agent{font-size:11px;color:var(--text-muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty-row{color:var(--text-muted);font-size:12px}
  .settings-grid{display:grid;grid-template-columns:minmax(220px,1fr) minmax(260px,1.4fr);gap:14px 18px;align-items:end}
  .settings-field{min-width:0}
  .settings-field .form-label{display:flex;justify-content:space-between;gap:8px}
  .settings-field__meta{font-size:10px;color:var(--text-muted);font-family:'SF Mono',monospace}
  .settings-field__desc{font-size:11px;color:var(--text-muted);line-height:1.4;margin-top:5px}
  .settings-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px}
  .restart-note{font-size:12px;color:var(--orange)}
  .table-scroll{width:100%;overflow-x:auto}
  .audit-table{table-layout:fixed;min-width:900px}
  .audit-table th,.audit-table td{box-sizing:border-box}
  .audit-table th:nth-child(1),.audit-table td:nth-child(1){width:150px}
  .audit-table th:nth-child(2),.audit-table td:nth-child(2){width:160px}
  .audit-table th:nth-child(3),.audit-table td:nth-child(3){width:130px}
  .audit-table th:nth-child(4),.audit-table td:nth-child(4){width:120px}
  .audit-table th:nth-child(5),.audit-table td:nth-child(5){width:170px}
  .audit-table th:nth-child(6),.audit-table td:nth-child(6){width:auto}
  .audit-table td:nth-child(2) .badge{white-space:normal;overflow-wrap:anywhere;line-height:1.35}
  .audit-table .cell-agent{max-width:none;white-space:normal;overflow-wrap:anywhere}
  .passkey-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;
    border-bottom:1px solid var(--border-subtle)}
  .passkey-row:last-child{border-bottom:0}
  .passkey-row__name{font-family:'SF Mono','Fira Code','Cascadia Code',monospace;font-size:13px;
    color:var(--text-primary);font-weight:600}
  .passkey-row__meta{font-size:11px;color:var(--text-muted);margin-top:5px}
  @media(max-width:600px){.stat-grid{grid-template-columns:repeat(2,1fr)}.hide-sm{display:none}.newuser{grid-template-columns:1fr}}
  @media(max-width:800px){.settings-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
  <dialog class="modal modal--permanent" id="settings-modal"
          aria-modal="true" aria-labelledby="settings-title">
    <!-- Flash messages (incl. one-time temp passwords) must live INSIDE the
         permanent dialog: a modal dialog paints in the browser top layer
         above any z-index, so a body-level flash is invisible here. -->
    <div id="flash"></div>

    <!-- Sidebar -->
    <aside class="modal__sidebar">
      <div class="sidebar__search">
        <svg class="sidebar__search-icon" width="14" height="14" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="search" id="sidebar-search" placeholder="Search"
               aria-label="Search settings" />
      </div>
      <nav id="settings-nav" aria-label="Settings navigation"></nav>
    </aside>

    <!-- Content -->
    <div class="modal__content" id="settings-content">
      <!-- Panes rendered here by showPane() -->
    </div>

    <div class="edit-dialog-backdrop" id="edit-dialog-backdrop" aria-hidden="true" inert>
    <section class="edit-dialog" role="dialog" aria-modal="true" aria-labelledby="edit-dialog-title">
      <h2 class="edit-dialog__title" id="edit-dialog-title">Edit user</h2>
      <p class="edit-dialog__desc" id="edit-dialog-desc"></p>
      <label class="form-label" id="edit-dialog-label" for="edit-dialog-input"></label>
      <input class="form-input" id="edit-dialog-input" autocomplete="off">
      <div class="edit-dialog__actions">
        <button class="btn btn-secondary" id="edit-dialog-cancel" type="button">Cancel</button>
        <button class="btn btn-primary" id="edit-dialog-save" type="button">Save</button>
      </div>
    </section>
    </div>

    <div class="edit-dialog-backdrop" id="rotate-dialog-backdrop" aria-hidden="true" inert>
    <section class="edit-dialog" role="alertdialog" aria-modal="true" aria-labelledby="rotate-dialog-title">
      <h2 class="edit-dialog__title" id="rotate-dialog-title">Rotate signing key</h2>
      <p class="edit-dialog__desc" id="rotate-dialog-desc"></p>
      <div class="danger-dialog__warning" id="rotate-dialog-warning"></div>
      <div class="edit-dialog__actions">
        <button class="btn btn-secondary" id="rotate-dialog-cancel" type="button">Cancel</button>
        <button class="btn btn-danger" id="rotate-dialog-confirm" type="button">Stage rotation</button>
      </div>
    </section>
    </div>

    <div class="edit-dialog-backdrop" id="danger-dialog-backdrop" aria-hidden="true" inert>
    <section class="edit-dialog" role="alertdialog" aria-modal="true" aria-labelledby="danger-dialog-title">
      <h2 class="edit-dialog__title" id="danger-dialog-title">Confirm sensitive action</h2>
      <p class="edit-dialog__desc" id="danger-dialog-desc"></p>
      <div class="danger-dialog__warning" id="danger-dialog-warning"></div>
      <div class="edit-dialog__actions">
        <button class="btn btn-secondary" id="danger-dialog-cancel" type="button">Cancel</button>
        <button class="btn btn-danger" id="danger-dialog-confirm" type="button">Confirm</button>
      </div>
    </section>
    </div>
  </dialog>

<script nonce="{{.Nonce}}">
var IS_ADMIN = {{.IsAdmin}};
var CURRENT_USER = "{{.User}}";
var CSRF_TOKEN = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
var FORM_TOKEN = "{{.FT}}";
var FRAME_ANCESTORS = {{.FrameAncestors}};
var EMBEDDED = window.self !== window.top;

// ── embedder signal ──────────────────────────────────────────────────────
// A framed page cannot read its parent's origin cross-origin, so this
// targets every origin CSP already allows to frame /auth/app (frame-ancestors
// in allowAppFraming) — a mismatched targetOrigin is silently dropped by the
// browser, so posting to all of them is safe. Consumed by the honeypot
// dashboard's settings popup (issue #93 in Xore/honeypot-stack) to close the
// modal or re-check the caller's own session on "close"/"expired".
function notifyEmbedder(type) {
  if (!EMBEDDED) return;
  FRAME_ANCESTORS.forEach(function (origin) {
    try { window.parent.postMessage({source: 'xore-auth-app', type: type}, origin); } catch (e) { /* unreachable parent */ }
  });
}

var activePane = 'account';
var state = {users: [], audit: {Recent: [], Total: 0, Success: 0, Failed: 0}, locked: [], sessions: []};

// ── helpers ──────────────────────────────────────────────────────────────
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
  });
}
// firstPermissionEntry formats one host's grants as "host: key, key" to
// pre-fill the permissions edit dialog -- v1 edits one host per submission,
// so this just picks a stable (sorted) starting point, not "the" host.
function firstPermissionEntry(permissions) {
  if (!permissions) return '';
  var hosts = Object.keys(permissions).sort();
  if (!hosts.length) return '';
  var host = hosts[0];
  return host + ': ' + (permissions[host] || []).join(', ');
}
function ts(s) {
  if (!s || s.startsWith('0001')) return '–';
  var d = new Date(s);
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString();
}
function ago(s) {
  if (!s || s.startsWith('0001')) return '–';
  var ms = Date.now() - new Date(s).getTime();
  var m = Math.floor(ms / 60000);
  if (m < 1) return 'now';
  if (m < 60) return m + 'm ago';
  var h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}
function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text);
    return;
  }
  // Fallback for non-secure contexts / older browsers
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) { /* no clipboard access */ }
  document.body.removeChild(ta);
}

// ── admin API helpers ────────────────────────────────────────────────────
function flash(msg, isErr) {
  var f = document.getElementById('flash');
  f.innerHTML = msg;
  f.className = isErr ? 'err' : '';
  f.style.display = 'block';
  clearTimeout(f._t);
  f._t = setTimeout(function () { f.style.display = 'none'; }, isErr ? 6000 : 12000);
}

function api(path, body) {
  return fetch('/_auth/admin/api/' + path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-Csrf': CSRF_TOKEN},
    body: JSON.stringify(body)
  })
    .then(function (r) {
      if (r.status === 401 || r.status === 403) notifyEmbedder('expired');
      return r.json().catch(function () { return {error: 'http ' + r.status}; });
    })
    .then(function (j) { if (j.error) { flash(esc(j.error), true); throw j.error; } return j; });
}

function act(action, extra) {
  var b = extra || {};
  b.action = action;
  return api('action', b).then(function (j) { fetchState(); return j; });
}

var pendingDangerAction = null;

function openDangerDialog(title, desc, warningHTML, confirmLabel, callback) {
  pendingDangerAction = callback;
  document.getElementById('danger-dialog-title').textContent = title;
  document.getElementById('danger-dialog-desc').textContent = desc;
  document.getElementById('danger-dialog-warning').innerHTML = warningHTML;
  document.getElementById('danger-dialog-confirm').textContent = confirmLabel || 'Confirm';
  var backdrop = document.getElementById('danger-dialog-backdrop');
  backdrop.removeAttribute('inert');
  backdrop.classList.add('open');
  backdrop.setAttribute('aria-hidden', 'false');
  document.getElementById('danger-dialog-confirm').focus();
}

function closeDangerDialog() {
  document.getElementById('danger-dialog-backdrop').classList.remove('open');
  document.getElementById('danger-dialog-backdrop').setAttribute('aria-hidden', 'true');
  document.getElementById('danger-dialog-backdrop').setAttribute('inert', '');
  pendingDangerAction = null;
}

function runDangerAction() {
  var callback = pendingDangerAction;
  if (!callback) return;
  pendingDangerAction = null;
  closeDangerDialog();
  callback();
}

function confirmAct(msg, action, extra) {
  var target = extra.username || extra.ip || 'this target';
  var details = {
    enable: ['Enable ' + target + '?', 'This restores the account’s ability to sign in immediately. Existing credentials become usable again.', 'Enable user'],
    disable: ['Disable ' + target + '?', 'This blocks future sign-ins and immediately invalidates the user’s sessions and trusted devices.', 'Disable user'],
    delete: ['Delete ' + target + '?', 'This permanently removes the account, password, two-factor enrollment, backup codes and passkeys. This cannot be undone.', 'Delete user'],
    reset_password: ['Reset password for ' + target + '?', 'A new temporary password replaces the current password. All sessions and trusted devices are invalidated, and the user must change it at next sign-in.', 'Reset password'],
    reset_totp: ['Reset two-factor authentication for ' + target + '?', 'The TOTP secret and every backup code are deleted. All sessions and trusted devices are invalidated. The user must enroll again when two-factor is required.', 'Reset two-factor'],
    reset_passkeys: ['Remove all passkeys for ' + target + '?', 'Every registered passkey is deleted and all sessions and trusted devices are invalidated. Password sign-in remains available.', 'Reset passkeys'],
    logout_user: ['Log ' + target + ' out everywhere?', 'Every current session and trusted-device token for this user becomes invalid immediately. The user must authenticate again on every device.', 'Log out everywhere'],
    set_role: [(extra.role === 'admin' ? 'Promote ' : 'Demote ') + target + '?',
      extra.role === 'admin' ? 'This grants full administrator access to users, audit logs, sessions and system configuration.' : 'This removes administrator access immediately. Existing authentication sessions remain signed in as a regular user.',
      extra.role === 'admin' ? 'Promote to admin' : 'Demote to user'],
    unlock: ['Unlock ' + target + '?', 'This clears accumulated login failures and the lockout immediately, allowing new authentication attempts from this IP address.', 'Unlock IP']
  };
  var copy = details[action] || [msg || 'Confirm action?', msg || 'This changes authentication state.', 'Confirm'];
  var doneMsgs = {
    enable: 'Enabled <b>' + esc(target) + '</b> — the account can sign in again immediately.',
    disable: 'Disabled <b>' + esc(target) + '</b> — sessions and trusted devices invalidated.',
    delete: 'Deleted <b>' + esc(target) + '</b> — the account is permanently removed.',
    reset_totp: 'Two-factor reset for <b>' + esc(target) + '</b> — they re-enroll at their next sign-in.',
    reset_passkeys: 'Removed every passkey for <b>' + esc(target) + '</b> — sessions and trusted devices invalidated.',
    logout_user: 'Logged <b>' + esc(target) + '</b> out on every device.',
    set_role: extra.role === 'admin'
      ? 'Promoted <b>' + esc(target) + '</b> to administrator.'
      : 'Demoted <b>' + esc(target) + '</b> to regular user.',
    unlock: 'Unlocked <b>' + esc(target) + '</b> — lockout and failure count cleared.'
  };
  openDangerDialog(copy[0], 'Review the consequences before continuing.',
    '<b>This action takes effect immediately:</b><p class="u-mt8">' + esc(copy[1]) + '</p>',
    copy[2], function () {
      act(action, extra).then(function (j) {
        if (j.temp_password) flash('temp password for ' + esc(extra.username) + ': <b>' + esc(j.temp_password) + '</b><br>shown once — send it over a secure channel');
        else if (doneMsgs[action]) flash(doneMsgs[action]);
      }).catch(function () { /* error already flashed by api() */ });
    });
}

function createUser(confirmed) {
  var name = document.getElementById('nu-name').value.trim();
  var role = document.getElementById('nu-role').value;
  var email = document.getElementById('nu-email').value.trim();
  var hosts = document.getElementById('nu-hosts').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  if (!name) { flash('username required', true); return; }
  if (role === 'admin' && !confirmed) {
    openDangerDialog('Create a new administrator?', 'The new account will receive full administrative access after completing its first sign-in.',
      '<b>This grants sensitive access:</b><p class="u-mt8">The account can manage users, inspect audit and session data, alter system configuration, and rotate authentication keys.</p>',
      'Create administrator', function () { createUser(true); });
    return;
  }
  api('user', {username: name, role: role, email: email, allowed_hosts: hosts}).then(function (j) {
    document.getElementById('nu-name').value = '';
    document.getElementById('nu-email').value = '';
    document.getElementById('nu-hosts').value = '';
    flash('created <b>' + esc(name) + '</b> — temp password: <b>' + esc(j.temp_password) + '</b><br>shown once — they must change it on first login');
    fetchState();
  }).catch(function () { /* error already flashed by api() */ });
}

function editHosts(name, cur) {
  openEditDialog('hosts', name, cur);
}

function editEmail(name, cur) {
  openEditDialog('email', name, cur);
}

function editDisplayName(name, cur) {
  openEditDialog('display_name', name, cur);
}

function editDescription(name, cur) {
  openEditDialog('description', name, cur);
}

function editPermissions(name, cur) {
  // v1: one host's grants at a time. cur is pre-filled with the first host
  // this user already has grants for, formatted "host: key, key" -- submit
  // again with a different host prefix to edit another host's grants; other
  // hosts' grants are untouched by that submission.
  openEditDialog('permissions', name, cur);
}

function editUsername(name) {
  openEditDialog('username', name, name);
}

var editDialogState = null;

function openEditDialog(kind, name, current) {
  editDialogState = {kind: kind, username: name};
  var title = document.getElementById('edit-dialog-title');
  var desc = document.getElementById('edit-dialog-desc');
  var label = document.getElementById('edit-dialog-label');
  var input = document.getElementById('edit-dialog-input');
  if (kind === 'hosts') {
    title.textContent = 'Edit allowed hosts';
    desc.textContent = 'Update access for ' + name + '. Separate hosts with commas; wildcards such as *.example.com are supported. Leave blank to allow all hosts.';
    label.textContent = 'Allowed hosts';
    input.type = 'text';
    input.placeholder = 'grafana.example.com, *.media.example.com';
  } else if (kind === 'display_name') {
    title.textContent = 'Edit display name';
    desc.textContent = 'Set the name shown for ' + name + ' in consuming apps. Leave blank to fall back to the username.';
    label.textContent = 'Display name';
    input.type = 'text';
    input.placeholder = name;
  } else if (kind === 'description') {
    title.textContent = 'Edit description';
    desc.textContent = 'Admin-only note about ' + name + '. Never shown to the user themselves.';
    label.textContent = 'Description';
    input.type = 'text';
    input.placeholder = 'e.g. contractor, expires 2026-12-01';
  } else if (kind === 'permissions') {
    title.textContent = 'Edit permissions';
    desc.textContent = 'Grant ' + name + ' opaque, app-defined capability keys for one host at a time: "host: key, key". Leave the keys blank to clear that host’s grants. Other hosts’ grants are unaffected.';
    label.textContent = 'Host: permission keys';
    input.type = 'text';
    input.placeholder = 'dashboard.example.com: pages:sandbox:view, actions:export';
  } else if (kind === 'username') {
    title.textContent = 'Rename user';
    desc.textContent = 'Change the username ' + name + ' signs in with. Their current session is invalidated immediately and they must sign in again under the new name.';
    label.textContent = 'New username';
    input.type = 'text';
    input.placeholder = name;
  } else {
    title.textContent = 'Edit recovery email';
    desc.textContent = 'Set the address used for password recovery for ' + name + '. Leave blank to disable email recovery.';
    label.textContent = 'Recovery email';
    input.type = 'email';
    input.placeholder = 'user@example.com';
  }
  input.value = current || '';
  var backdrop = document.getElementById('edit-dialog-backdrop');
  backdrop.removeAttribute('inert');
  backdrop.classList.add('open');
  backdrop.setAttribute('aria-hidden', 'false');
  setTimeout(function () { input.focus(); input.select(); }, 0);
}

function closeEditDialog() {
  var backdrop = document.getElementById('edit-dialog-backdrop');
  backdrop.classList.remove('open');
  backdrop.setAttribute('aria-hidden', 'true');
  backdrop.setAttribute('inert', '');
  editDialogState = null;
}

var EDIT_DIALOG_ACTIONS = {
  hosts: 'set_hosts', email: 'set_email', display_name: 'set_display_name',
  description: 'set_description', permissions: 'set_permissions'
};
var EDIT_DIALOG_LABELS = {
  hosts: 'Allowed hosts', email: 'Recovery email', display_name: 'Display name',
  description: 'Description', permissions: 'Permissions'
};

function saveEditDialog() {
  if (!editDialogState) return;
  var kind = editDialogState.kind;
  var input = document.getElementById('edit-dialog-input');
  var value = input.value.trim();
  if (kind === 'email' && value && !input.checkValidity()) {
    input.reportValidity();
    return;
  }
  var request;
  if (kind === 'hosts') {
    request = {username: editDialogState.username, hosts: value.split(',').map(function (s) { return s.trim(); }).filter(Boolean)};
  } else if (kind === 'display_name') {
    request = {username: editDialogState.username, display_name: value};
  } else if (kind === 'description') {
    request = {username: editDialogState.username, description: value};
  } else if (kind === 'permissions') {
    var sep = value.indexOf(':');
    if (sep < 0 || !value.slice(0, sep).trim()) {
      flash('enter as "host: key, key"', true);
      return;
    }
    var host = value.slice(0, sep).trim();
    var keys = value.slice(sep + 1).split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    request = {username: editDialogState.username, host: host, permissions: keys};
  } else if (kind === 'username') {
    if (!value) { flash('username required', true); return; }
    if (value === editDialogState.username) { closeEditDialog(); return; }
    var oldName = editDialogState.username;
    closeEditDialog();
    openDangerDialog('Rename ' + oldName + ' to ' + value + '?',
      'Their current session is invalidated immediately.',
      '<b>This action takes effect immediately:</b><p class="u-mt8">They must sign in again as <b>' + esc(value) + '</b>. Anything referencing the old username by name (not by internal ID) will need updating separately.</p>',
      'Rename user', function () {
        act('rename_user', {username: oldName, new_username: value}).then(function () {
          flash('Renamed <b>' + esc(oldName) + '</b> to <b>' + esc(value) + '</b>.');
          fetchState();
        });
      });
    return;
  } else {
    request = {username: editDialogState.username, email: value};
  }
  var action = EDIT_DIALOG_ACTIONS[kind] || 'set_email';
  var user = editDialogState.username;
  act(action, request).then(function () {
    closeEditDialog();
    flash((EDIT_DIALOG_LABELS[kind] || 'Field') + ' updated for <b>' + esc(user) + '</b>.');
  });
}

function filterSidebar(query) {
  var q = query.toLowerCase();
  document.querySelectorAll('#settings-nav .sidebar__item').forEach(function (btn) {
    btn.style.display = btn.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none';
  });
  // Hide section labels whose items are all filtered out
  document.querySelectorAll('#settings-nav .sidebar__section-label').forEach(function (label) {
    var el = label.nextElementSibling, visible = false;
    while (el && !el.classList.contains('sidebar__section-label')) {
      if (el.classList.contains('sidebar__item') && el.style.display !== 'none') visible = true;
      el = el.nextElementSibling;
    }
    label.style.display = visible ? '' : 'none';
  });
}

function loadTrustedDevices() {
  var tb = document.getElementById('trusted-devices-body');
  if (!tb) return;
  fetch('/_auth/sessions/trusted')
    .then(function (r) { if (!r.ok) throw 'http ' + r.status; return r.json(); })
    .then(function (devices) {
      tb.innerHTML = (devices && devices.length) ? devices.map(function (d) {
        return '<tr><td>' + esc(d.name) + '</td>' +
          '<td class="cell-mono">' + ts(d.added) + '</td><td></td></tr>';
      }).join('') : '<tr><td colspan="3" class="empty-row">no trusted devices</td></tr>';
    })
    .catch(function (e) { /* keep last state */ });
}

function loadMySessions() {
  var tb = document.getElementById('my-sessions-body');
  if (!tb) return;
  fetch('/_auth/sessions/mine')
    .then(function (r) { if (!r.ok) throw 'http ' + r.status; return r.json(); })

var configSettings = null;

function renderConfigSettings(info) {
  configSettings = info;
  var el;
  if ((el = document.getElementById('brand-title'))) el.value = info.brand_title || '';
  if ((el = document.getElementById('brand-subtitle'))) el.value = info.brand_subtitle || '';
  if ((el = document.getElementById('brand-footer'))) el.value = info.brand_footer || '';
  var fields = document.getElementById('config-fields');
  if (!fields) return;
  fields.innerHTML = (info.fields || []).map(function (f) {
    var disabled = f.externally_managed ? ' disabled' : '';
    var pending = f.pending ? ' <span class="badge badge--orange">pending</span>' : '';
    var managed = f.externally_managed ? ' <span class="badge badge--muted">secret file</span>' : '';
    var status = pending + managed;
    var control;
    if (f.kind === 'bool') {
      control = '<select class="form-input" data-config-key="' + esc(f.key) + '"' + disabled + '>' +
        '<option value="true"' + (f.value === 'true' ? ' selected' : '') + '>true</option>' +
        '<option value="false"' + (f.value === 'false' ? ' selected' : '') + '>false</option></select>';
    } else {
      var type = f.kind === 'number' ? 'number' : (f.sensitive ? 'password' : 'text');
      var value = f.sensitive ? '' : ' value="' + esc(f.value || '') + '"';
      var placeholder = f.sensitive && f.configured ? ' placeholder="configured — enter to replace"' : '';
      control = '<input class="form-input" type="' + type + '" data-config-key="' + esc(f.key) + '"' +
        value + placeholder + disabled + '>';
    }
    return '<div class="settings-field"><label class="form-label"><span>' + esc(f.label) + status +
      '</span><span class="settings-field__meta">' + esc(f.key) + '</span></label>' + control +
      '<div class="settings-field__desc">' + esc(f.description) + '</div></div>';
  }).join('');
  if ((el = document.getElementById('restart-note'))) {
    el.textContent = info.restart_needed ? 'Restart required to activate staged settings.' : '';
  }
}

function loadConfigSettings() {
  fetch('/_auth/admin/api/settings')
    .then(function (r) { if (!r.ok) throw 'http ' + r.status; return r.json(); })
    .then(renderConfigSettings)
    .catch(function () { flash('Could not load configuration.', true); });
}

function confirmSettingsSave() {
  openDangerDialog('Save system configuration?',
    'Branding updates apply immediately. Application and infrastructure changes are staged for the next service restart.',
    '<b>Before continuing:</b><ul>' +
      '<li>Invalid host, storage, proxy, mail or backend values can prevent the service from starting or accepting sign-ins.</li>' +
      '<li>Restart every replica with the same persisted settings to avoid inconsistent authentication.</li>' +
      '<li>Secret fields left blank are unchanged; entered secret values replace the staged value.</li>' +
      '<li>Keep environment and Docker secret configuration documented so the change can be rolled back.</li></ul>',
    'Save configuration', saveConfigSettings);
}

function saveConfigSettings() {
  var updates = {};
  document.querySelectorAll('[data-config-key]').forEach(function (input) {
    if (!input.disabled) updates[input.getAttribute('data-config-key')] = input.value;
  });
  api('settings', {
    brand_title: document.getElementById('brand-title').value,
    brand_subtitle: document.getElementById('brand-subtitle').value,
    brand_footer: document.getElementById('brand-footer').value,
    updates: updates
  }).then(function (info) {
    renderConfigSettings(info);
    flash('Settings saved. Branding is live; staged configuration activates after restart.');
  });
}

var pendingRotationKey = '';

function rotateConfigKey(key) {
  pendingRotationKey = key;
  var isCookie = key === 'COOKIE_SECRET';
  document.getElementById('rotate-dialog-title').textContent =
    isCookie ? 'Rotate cookie and form signing key?' : 'Rotate session encryption key?';
  document.getElementById('rotate-dialog-desc').textContent =
    'This stages a cryptographically random replacement. Nothing changes until the service restarts.';
  document.getElementById('rotate-dialog-warning').innerHTML = isCookie
    ? '<b>After confirmation:</b><ul>' +
      '<li>The active COOKIE_SECRET is retained as COOKIE_SECRET_PREVIOUS.</li>' +
      '<li>Existing encrypted sessions remain valid, but trusted-device, form and recovery tokens transition to the new signing key.</li>' +
      '<li>Every replica must restart with the same staged settings or users may see inconsistent authentication.</li>' +
      '<li>Removing the previous key before the transition finishes invalidates outstanding signed tokens.</li></ul>'
    : '<b>After confirmation:</b><ul>' +
      '<li>The active PASETO key is retained as PASETO_KEY_PREVIOUS.</li>' +
      '<li>Existing sessions can be read with the previous key and are re-issued under the new key when used.</li>' +
      '<li>Every replica must restart with the same staged keys. A mismatched replica can reject valid sessions.</li>' +
      '<li>Removing the previous key before the longest session lifetime expires forces affected users to sign in again.</li></ul>';
  var backdrop = document.getElementById('rotate-dialog-backdrop');
  backdrop.removeAttribute('inert');
  backdrop.classList.add('open');
  backdrop.setAttribute('aria-hidden', 'false');
  document.getElementById('rotate-dialog-confirm').focus();
}

function closeRotateDialog() {
  document.getElementById('rotate-dialog-backdrop').classList.remove('open');
  document.getElementById('rotate-dialog-backdrop').setAttribute('aria-hidden', 'true');
  document.getElementById('rotate-dialog-backdrop').setAttribute('inert', '');
  pendingRotationKey = '';
}

function confirmConfigRotation() {
  var key = pendingRotationKey;
  if (!key) return;
  document.getElementById('rotate-dialog-confirm').disabled = true;
  api('settings', {rotate: key}).then(function (info) {
    document.getElementById('rotate-dialog-confirm').disabled = false;
    closeRotateDialog();
    renderConfigSettings(info);
    flash(esc(key) + ' rotation staged. Restart the service to activate it.');
  }).catch(function () {
    document.getElementById('rotate-dialog-confirm').disabled = false;
  });
}

  var locked = state.locked || [];
  var el;
  if ((el = document.getElementById('st-total')))  el.textContent = audit.Total;
  if ((el = document.getElementById('st-ok')))     el.textContent = audit.Success;
  if ((el = document.getElementById('st-fail')))   el.textContent = audit.Failed;
  if ((el = document.getElementById('st-locked'))) el.textContent = locked.length;

  var lb = document.getElementById('admin-locked-body');
  if (lb) {
    lb.innerHTML = locked.length ? locked.map(function (l) {
      return '<tr><td class="cell-mono">' + esc(l.IP) + '</td>' +
        '<td class="cell-mono">' + l.Fails + '</td>' +
        '<td class="cell-mono">' + ts(l.Until) + '</td>' +
        '<td><button class="btn btn-secondary btn-sm" data-act="unlock" data-ip="' + esc(l.IP) + '">unlock</button></td></tr>';
    }).join('') : '<tr><td colspan="4" class="empty-row">nothing locked out</td></tr>';
  }

  var qEl = document.getElementById('lf-text');
  var kindEl = document.getElementById('lf-kind');
  var q = qEl ? qEl.value.toLowerCase() : '';
  var kind = kindEl ? kindEl.value : '';
  var tb = document.getElementById('admin-logs-body');
  if (!tb) return;
  var rows = (audit.Recent || []).filter(function (e) {
    if (kind && e.event.indexOf(kind) !== 0) return false;
    if (q) {
      var hay = (e.event + ' ' + e.ip + ' ' + (e.user || '') + ' ' + (e.host || '')).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;

    return;
  }
  tb.innerHTML = rows.map(function (e) {
    var cls = e.event === 'login_ok' ? 'badge--green'
      : (e.event.indexOf('login_fail') === 0 || e.event === 'locked_out') ? 'badge--red'

      '<td class="cell-mono">' + ts(e.time) + '</td>' +
      '<td><span class="badge ' + cls + '" title="' + esc(e.event) + '">' + esc(e.event) + '</span></td>' +

      '<td class="cell-mono">' + esc(e.user || '–') + '</td>' +
      '<td class="cell-mono hide-sm">' + esc(e.host || '–') + '</td>' +
      '<td class="cell-agent hide-sm">' + esc(e.ua || '') + '</td>' +
      '</tr>';
  }).join('');
}

function base64urlToBytes(value) {
  var encoded = value.replace(/-/g, '+').replace(/_/g, '/');
  encoded += '='.repeat((4 - encoded.length % 4) % 4);
  return Uint8Array.from(atob(encoded), function (character) { return character.charCodeAt(0); });
}

function bytesToBase64url(buffer) {
  var binary = '';
  new Uint8Array(buffer).forEach(function (value) { binary += String.fromCharCode(value); });
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function passkeyCredentialJSON(credential) {
  return {
    id: credential.id,
    type: credential.type,
    rawId: bytesToBase64url(credential.rawId),
    response: {
      clientDataJSON: bytesToBase64url(credential.response.clientDataJSON),
      attestationObject: bytesToBase64url(credential.response.attestationObject),
      transports: credential.response.getTransports ? credential.response.getTransports() : []
    }
  };
}

function passkeyTimestamp(value, fallback) {
  if (!value || value.indexOf('0001-01-01') === 0) return fallback;
  var date = new Date(value);
  return isNaN(date.getTime()) ? fallback : date.toLocaleString();
}

function loadPasskeys() {
  var list = document.getElementById('passkey-list');
  if (!list) return;
  fetch('/_auth/passkeys/list')
    .then(function (response) {
      if (!response.ok) throw new Error('http ' + response.status);
      return response.json();
    })
    .then(function (keys) {
      if (!document.getElementById('passkey-list')) return;
      if (!keys.length) {
        list.innerHTML = '<div class="empty-row">No passkeys enrolled yet.</div>';
        return;
      }
      list.innerHTML = keys.map(function (key) {
        return '<div class="passkey-row">' +
          '<div><div class="passkey-row__name">' + esc(key.name || 'passkey') + '</div>' +
          '<div class="passkey-row__meta">Created ' + esc(passkeyTimestamp(key.created, 'unknown')) +
          ' · last used ' + esc(passkeyTimestamp(key.last_used, 'never')) + '</div></div>' +
          '<button class="btn btn-danger btn-sm" type="button" data-passkey-id="' + esc(key.id) +
          '" data-passkey-name="' + esc(key.name || 'passkey') + '">Remove</button></div>';
      }).join('');
    })
    .catch(function () {
      if (document.getElementById('passkey-list')) {
        list.innerHTML = '<div class="empty-row">Could not load passkeys.</div>';
      }
    });
}

function addPasskey() {
  var button = document.getElementById('add-passkey');
  var nameInput = document.getElementById('passkey-name');
  if (!button || !nameInput) return;
  if (!window.PublicKeyCredential || !navigator.credentials) {
    flash('Passkeys are not supported by this browser.', true);
    return;
  }
  button.disabled = true;
  fetch('/_auth/passkeys/register/begin', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-Csrf': CSRF_TOKEN},
    body: JSON.stringify({name: nameInput.value})
  })
    .then(function (response) {
      return response.json().then(function (data) {
        if (!response.ok) throw new Error(data.error || 'Could not start passkey registration.');
        return data;
      });
    })
    .then(function (data) {
      var options = data.options.publicKey;
      options.challenge = base64urlToBytes(options.challenge);
      options.user.id = base64urlToBytes(options.user.id);
      (options.excludeCredentials || []).forEach(function (credential) {
        credential.id = base64urlToBytes(credential.id);
      });
      return navigator.credentials.create({publicKey: options}).then(function (credential) {
        return {transaction: data.transaction, credential: credential};
      });
    })
    .then(function (registration) {
      return fetch('/_auth/passkeys/register/finish', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Csrf': CSRF_TOKEN,
          'X-WebAuthn-Transaction': registration.transaction
        },
        body: JSON.stringify(passkeyCredentialJSON(registration.credential))
      });
    })
    .then(function (response) {
      return response.json().then(function (data) {
        if (!response.ok) throw new Error(data.error || 'Passkey registration failed.');
        nameInput.value = '';
        loadPasskeys();
        flash('Passkey added.');
      });
    })
    .catch(function (error) {
      if (error && error.name === 'NotAllowedError') {
        flash('Passkey registration was cancelled or timed out.', true);
      } else {
        flash(error.message || 'Passkey registration failed.', true);
      }
    })
    .then(function () {
      if (document.getElementById('add-passkey')) button.disabled = false;
    });
}

function removePasskey(id, name) {
  openDangerDialog('Remove this passkey?', 'The passkey “' + name + '” will no longer sign in to this account.',
    '<b>This action takes effect immediately:</b><p class="u-mt8">This credential cannot be restored. Make sure you retain another sign-in method before removing it.</p>',
    'Remove passkey', function () {
      fetch('/_auth/passkeys/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-Csrf': CSRF_TOKEN},
        body: JSON.stringify({id: id})
      }).then(function (response) {
        if (!response.ok) throw new Error('http ' + response.status);
        loadPasskeys();
        flash('Passkey removed.');
      }).catch(function () { flash('Could not remove passkey.', true); });
    });
}

var PANE_LOADERS = {
  'account':        loadAccount,
  'passkeys':       loadPasskeys,
  'sessions':       loadMySessions,
  'admin-users':    loadAdminUsers,
  'admin-logs':     loadAdminLogs,
  'admin-sessions': loadAdminSessions,
  'admin-settings': loadConfigSettings,
  'admin-system':   loadSystem
};

function showPane(id) {
  activePane = id;
  renderNav(); // re-render sidebar to update .active class

  var content = document.getElementById('settings-content');
  content.innerHTML = PANE_TEMPLATES[id] || PANE_TEMPLATES['account'];
  content.scrollTop = 0;

  if (PANE_LOADERS[id]) PANE_LOADERS[id]();
}

// ── state polling (admin only) ───────────────────────────────────────────
function fetchState() {
  if (!IS_ADMIN) return;
  fetch('/_auth/admin/api/state?n=300')
    .then(function (r) {
      if (r.status === 401 || r.status === 403) notifyEmbedder('expired');
      if (!r.ok) throw 'http ' + r.status; return r.json();
    })
    .then(function (j) {
      state = j;
      // Configuration is loaded independently. Refreshing it with the
      // five-second state poll would overwrite values while an admin types.
      if (activePane !== 'admin-settings' && PANE_LOADERS[activePane]) {
        PANE_LOADERS[activePane]();
      }
    })
    .catch(function (e) { /* transient poll error — keep last state */ });
}

// ── session polling (all roles, embedded only) ───────────────────────────
// fetchState above only runs for admins. A plain user embedded in the
// dashboard's settings popup needs its own signal that the session ended,
// so this checks the one session endpoint every authenticated user can
// already reach (issue #93).
function pollOwnSession() {
  fetch('/_auth/sessions/mine', {cache: 'no-store'})
    .then(function (r) { if (r.status === 401 || r.status === 403) notifyEmbedder('expired'); })
    .catch(function (e) { /* transient poll error */ });
}

// ── modal open/close ─────────────────────────────────────────────────────
function openSettings(pane) {
  var modal = document.getElementById('settings-modal');
  modal.classList.add('open');
  if (modal.showModal) modal.showModal();
  renderNav();
  showPane(pane || 'account');
  fetchState();
}

// Keyboard shortcuts for nested dialogs; the settings surface remains open.
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && pendingDangerAction &&
      document.getElementById('danger-dialog-backdrop').classList.contains('open') &&
      document.activeElement.id !== 'danger-dialog-cancel') {
    e.preventDefault();
    runDangerAction();
    return;
  }
  if (e.key === 'Escape') {
    if (pendingDangerAction) { closeDangerDialog(); return; }
    if (pendingRotationKey) { closeRotateDialog(); return; }
    if (editDialogState) { closeEditDialog(); return; }
    var openMenu = document.querySelector('.action-menu[open]');
    if (openMenu) { openMenu.removeAttribute('open'); return; }
  }
});

document.addEventListener('toggle', function (e) {
  if (!e.target.matches || !e.target.matches('.action-menu[open]')) return;
  document.querySelectorAll('.action-menu[open]').forEach(function (menu) {
    if (menu !== e.target) menu.removeAttribute('open');
  });
}, true);

document.getElementById('sidebar-search').addEventListener('input', function () { filterSidebar(this.value); });

// Delegated: modal close button (re-inserted on every pane switch) and
// sidebar nav items (re-rendered by renderNav)
document.addEventListener('click', function (e) {
  if (!e.target.closest('.action-menu')) {
    document.querySelectorAll('.action-menu[open]').forEach(function (menu) { menu.removeAttribute('open'); });
  }
  var menuAction = e.target.closest('.action-menu__item');
  if (menuAction) menuAction.closest('.action-menu').removeAttribute('open');
  if (e.target.closest('#account-logout')) {
    // Give the postMessage a tick to reach the embedder before this frame
    // navigates itself away and its message queue goes with it.
    e.preventDefault();
    notifyEmbedder('close');
    setTimeout(function () { window.location.href = '/_auth/logout'; }, 0);
    return;
  }
  var item = e.target.closest('#settings-nav .sidebar__item');
  if (item && item.dataset.pane) { showPane(item.dataset.pane); return; }
  if (e.target.closest('#add-passkey')) { addPasskey(); return; }
  var passkey = e.target.closest('button[data-passkey-id]');
  if (passkey) {
    removePasskey(passkey.getAttribute('data-passkey-id'), passkey.getAttribute('data-passkey-name'));
    return;
  }
  var rev = e.target.closest('button[data-revoke-sid]');
  if (rev) { revokeSession(rev.getAttribute('data-revoke-sid')); return; }
  if (e.target.closest('#nu-create')) { createUser(); return; }
  if (e.target.closest('#regenerate-backup-codes')) {
    openDangerDialog('Regenerate backup codes?', 'The current recovery codes will stop working.',
      '<b>This action takes effect immediately:</b><p class="u-mt8">All existing backup codes and trusted-device tokens are invalidated. Store the newly generated codes before leaving the next screen.</p>',
      'Regenerate codes', function () { document.getElementById('backup-codes-form').submit(); });
    return;
  }
  if (e.target.closest('#save-settings')) { confirmSettingsSave(); return; }
  var rotate = e.target.closest('button[data-rotate-key]');
  if (rotate) { rotateConfigKey(rotate.getAttribute('data-rotate-key')); return; }
  var b = e.target.closest('button[data-act]');
  if (!b) return;
  var d = b.dataset;
  if (d.act === 'edit_hosts') { editHosts(d.user, d.hosts); return; }
  if (d.act === 'edit_email') { editEmail(d.user, d.email); return; }
  if (d.act === 'edit_display_name') { editDisplayName(d.user, d.displayName); return; }
  if (d.act === 'edit_description') { editDescription(d.user, d.description); return; }
  if (d.act === 'edit_permissions') { editPermissions(d.user, d.permissions); return; }
  if (d.act === 'edit_username') { editUsername(d.user); return; }
  var extra = {};
  if (d.user) extra.username = d.user;
  if (d.ip) extra.ip = d.ip;
  if (d.sid) extra.sid = d.sid;
  if (d.role) extra.role = d.role;
  var sensitiveActions = ['enable', 'disable', 'delete', 'reset_password', 'reset_totp', 'reset_passkeys', 'logout_user', 'set_role', 'unlock'];
  if (d.msg || sensitiveActions.indexOf(d.act) >= 0) { confirmAct(d.msg, d.act, extra); } else { act(d.act, extra); }
});

function revokeSession(sid) {
  openDangerDialog('Revoke this session?', 'The selected browser session will be invalidated immediately.',
    '<b>This action takes effect immediately:</b><p class="u-mt8">The session cannot be restored. The user must authenticate again on that device.</p>',
    'Revoke session', function () { performRevokeSession(sid); });
}

function performRevokeSession(sid) {
  fetch('/_auth/admin/api/sessions/' + encodeURIComponent(sid) + '/revoke', {
    method: 'POST',
    headers: {'X-Csrf': CSRF_TOKEN}
  }).then(function (r) {
    if (r.ok) { flash('Session revoked — the user must sign in again on that device.'); fetchState(); } else { flash('revoke failed (http ' + r.status + ')', true); }
  }).catch(function () { flash('revoke failed', true); });
}

contentEl.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || activePane !== 'admin-settings') return;
  if (!e.target.matches('#brand-title, #brand-subtitle, #brand-footer, [data-config-key]')) return;
  e.preventDefault();
  e.stopPropagation();
  if (!pendingDangerAction) confirmSettingsSave();
});

setInterval(fetchState, 5000);
if (EMBEDDED) setInterval(pollOwnSession, 15000);

window.onload = function () {
  var requestedPane = new URLSearchParams(window.location.search).get('pane');
  openSettings(PANE_TEMPLATES[requestedPane] ? requestedPane : 'account');
};
</script>
</body>
</html>
