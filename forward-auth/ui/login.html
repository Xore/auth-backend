<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Sign in — {{.BrandTitle}}</title>
  <link rel="stylesheet" href="/static/tailwind.min.css" />
  <link rel="stylesheet" href="/static/theme.css" />
  <style nonce="{{.Nonce}}">
    html { background: var(--app-bg); }
    body.auth-login { background: var(--app-bg); color: var(--text-primary); }
    .login-brand h1 { color: var(--text-primary); }
    .login-card {
      background: var(--surface-1);
      border-color: var(--border-subtle);
      border-radius: var(--radius-panel);
      box-shadow: none;
    }
    .login-input {
      background: var(--surface-0);
      border-color: var(--border-subtle);
      border-radius: var(--radius-control);
      color: var(--text-primary);
    }
    .login-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }
    .login-primary {
      background: var(--accent);
      border-radius: var(--radius-control);
      color: var(--text-on-accent);
    }
    .login-primary:hover { background: var(--accent-hover); }
    .btn-social {
      background: var(--surface-1);
      border-color: var(--border-subtle);
      border-radius: var(--radius-control);
      color: var(--text-primary);
    }
    .btn-social:hover { background: var(--surface-hover); border-color: var(--border-strong); }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border-subtle);
    }
    .trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body class="auth-login h-full font-sans flex flex-col items-center justify-center px-4">

  <!-- Brand headline -->
  <div class="login-brand mb-8 text-center select-none">
    <h1 class="font-serif text-4xl sm:text-5xl font-normal leading-tight">
      {{.BrandTitle}}
    </h1>
    <p class="mt-3 text-sm text-muted max-w-xs mx-auto">
      {{.BrandSubtitle}}
    </p>
  </div>

  <!-- Auth card -->
  <div class="login-card w-full max-w-sm border p-7">

    {{if .SSOEnabled}}
    <a
      href="/_auth/sso{{if .RD}}?rd={{.RD}}{{end}}"
      class="btn-social w-full flex items-center justify-center gap-3
             bg-surface border border-border rounded-xl px-4 py-3
             text-sm font-medium text-white transition-colors no-underline mb-3">
      <svg class="w-5 h-5 flex-shrink-0 text-muted" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="1.6">
        <rect x="2" y="7" width="20" height="14" rx="2"/>
        <path stroke-linecap="round" d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
      </svg>
      Continue with SSO
    </a>
    <div class="divider flex items-center gap-3 my-5">
      <span class="text-xs text-muted lowercase tracking-wide">or</span>
    </div>
    {{end}}

    {{if .Error}}
    <p class="mb-3 text-xs text-red-400 text-center">{{.Error}}</p>
    {{end}}

    <form method="POST" action="/_auth/login" autocomplete="off" id="login-form">
      <input type="hidden" name="ft" value="{{.FT}}" />
      <input type="hidden" name="rd" value="{{.RD}}" />
      <div class="trap" aria-hidden="true">
        <label>Leave this field empty</label>
        <input type="text" name="website" tabindex="-1" autocomplete="off" />
      </div>

      <!-- Step 1 — identifier -->
      <div id="step-user">
        <div class="mb-4">
          <label for="u" class="block text-xs text-muted mb-1 font-medium">Username or email</label>
          <input
            id="u"
            name="username"
            type="text"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            autofocus
            required
            class="login-input w-full border px-4 py-3
                   text-sm placeholder-muted transition-colors" />
        </div>
        <button
          type="button"
          id="btn-continue"
          class="login-primary w-full px-4 py-3
                 text-sm font-semibold transition-colors">
          Continue
        </button>
      </div>

      <!-- Step 2 — password / passkey -->
      <div id="step-pass" class="hidden">
        <div class="mb-4 flex items-center justify-between text-xs">
          <span class="text-muted">signing in as <span id="who" class="text-white font-medium"></span></span>
          <button type="button" id="btn-back"
                  class="text-muted hover:text-white underline underline-offset-2 transition-colors">
            change
          </button>
        </div>
        <div class="mb-4">
          <label for="p" class="block text-xs text-muted mb-1 font-medium">Password</label>
          <input
            id="p"
            name="password"
            type="password"
            autocomplete="current-password"
            class="login-input w-full border px-4 py-3
                   text-sm placeholder-muted transition-colors" />
        </div>
        {{if .Remember}}
        <label class="mb-4 flex items-center gap-2 text-xs text-muted cursor-pointer select-none">
          <input type="checkbox" name="remember" value="1" class="accent-primary" />
          trust this device for {{.TrustDays}} days (skips 2fa)
        </label>
        {{end}}
        <button
          type="submit"
          class="login-primary w-full px-4 py-3
                 text-sm font-semibold transition-colors mb-3">
          Sign in
        </button>
        <button
          type="button"
          id="passkey-login"
          class="btn-social w-full flex items-center justify-center gap-3
                 bg-surface border border-border rounded-xl px-4 py-3
                 text-sm font-medium text-white transition-colors">
          <svg class="w-5 h-5 flex-shrink-0 text-muted" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="1.6">
            <circle cx="8" cy="12" r="4"/>
            <path stroke-linecap="round" d="M12 12h10v3M18 12v2.5"/>
          </svg>
          Sign in with a passkey
        </button>
      </div>
    </form>

    {{if .RecoverEnabled}}
    <p class="mt-3 text-center">
      <a href="/_auth/recover"
         class="text-xs text-muted hover:text-white transition-colors underline underline-offset-2">
        Forgot your password?
      </a>
    </p>
    {{end}}

    <p class="mt-5 text-center text-xs text-muted leading-relaxed">
      {{.BrandFooter}}
    </p>
  </div>

  <script nonce="{{.Nonce}}">
    function nextStep() {
      var u = document.getElementById('u');
      if (!u.value.trim()) { u.focus(); return; }
      document.getElementById('who').textContent = u.value.trim();
      document.getElementById('step-user').classList.add('hidden');
      document.getElementById('step-pass').classList.remove('hidden');
      document.getElementById('p').focus();
    }
    function prevStep() {
      document.getElementById('step-pass').classList.add('hidden');
      document.getElementById('step-user').classList.remove('hidden');
      document.getElementById('u').focus();
    }
    document.getElementById('btn-continue').addEventListener('click', nextStep);
    document.getElementById('btn-back').addEventListener('click', prevStep);
    document.getElementById('u').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); nextStep(); }
    });

    const b64buf = s => { s=s.replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0)); };
    const b64url = b => { let s=''; new Uint8Array(b).forEach(v=>s+=String.fromCharCode(v)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
    const credentialJSON = c => ({id:c.id,type:c.type,rawId:b64url(c.rawId),response:{
      authenticatorData:c.response.authenticatorData?b64url(c.response.authenticatorData):undefined,
      clientDataJSON:b64url(c.response.clientDataJSON),signature:c.response.signature?b64url(c.response.signature):undefined,
      userHandle:c.response.userHandle?b64url(c.response.userHandle):null,
      attestationObject:c.response.attestationObject?b64url(c.response.attestationObject):undefined,
      transports:c.response.getTransports?c.response.getTransports():undefined}});
    document.getElementById('passkey-login').onclick = async function(){
      const user=document.getElementById('u').value.trim();
      if(!user){ prevStep(); document.getElementById('u').focus(); return; }
      this.disabled=true;
      try {
        const begin=await fetch('/_auth/passkeys/login/begin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,redirect:document.querySelector('[name=rd]').value})});
        if(!begin.ok) throw new Error('Passkey sign-in is unavailable.');
        const data=await begin.json(), opts=data.options.publicKey;
        opts.challenge=b64buf(opts.challenge); (opts.allowCredentials||[]).forEach(x=>x.id=b64buf(x.id));
        const cred=await navigator.credentials.get({publicKey:opts});
        const finish=await fetch('/_auth/passkeys/login/finish',{method:'POST',headers:{'Content-Type':'application/json','X-WebAuthn-Transaction':data.transaction},body:JSON.stringify(credentialJSON(cred))});
        const result=await finish.json(); if(!finish.ok) throw new Error(result.error||'Passkey sign-in failed.');
        location.assign(result.redirect);
      } catch(e) { alert(e.message||'Passkey sign-in failed.'); this.disabled=false; }
    };
  </script>
</body>
</html>
