<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — {{.AppName}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            /* Claude-inspired palette */
            bg:       '#1a1a1a',
            surface:  '#242424',
            border:   '#2e2e2e',
            muted:    '#8a8a8a',
            primary:  '#d4764e',   /* warm terracotta accent */
            primaryh: '#c4673f',
            inputbg:  '#1f1f1f',
          },
          fontFamily: {
            serif: ['Georgia', 'Cambria', 'serif'],
            sans:  ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    html { background: #1a1a1a; }
    /* focus ring matches Claude blue-ish glow */
    input:focus { outline: none; box-shadow: 0 0 0 2px rgba(212,118,78,0.45); }
    .btn-google:hover { background: #2a2a2a; }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: #2e2e2e;
    }
  </style>
</head>
<body class="h-full font-sans bg-bg text-white flex flex-col items-center justify-center px-4">

  <!-- ── Brand headline ─────────────────────────────── -->
  <div class="mb-8 text-center select-none">
    <h1 class="font-serif text-4xl sm:text-5xl font-normal leading-tight">Question what's<br>next</h1>
    <p class="mt-3 text-sm text-muted tracking-wide">Your thinking partner for big ambitions</p>
  </div>

  <!-- ── Auth card ──────────────────────────────────── -->
  <div class="w-full max-w-sm bg-surface border border-border rounded-2xl p-7 shadow-xl">

    <!-- Google SSO -->
    <button
      onclick="window.location='{{.GoogleOAuthURL}}'"
      class="btn-google w-full flex items-center justify-center gap-3 bg-surface border border-border rounded-xl px-4 py-3 text-sm font-medium text-white transition-colors hover:border-muted">
      <!-- Google G logo -->
      <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <!-- Passkey button -->
    <button
      onclick="startPasskeyAuth()"
      class="mt-3 w-full flex items-center justify-center gap-3 bg-surface border border-border rounded-xl px-4 py-3 text-sm font-medium text-white transition-colors hover:border-muted">
      <!-- Passkey icon -->
      <svg class="w-5 h-5 flex-shrink-0 text-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
        <circle cx="12" cy="8" r="4"/>
        <path stroke-linecap="round" d="M6 20v-1a6 6 0 0 1 8.9-5.2"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 14v2m0 4v-2m0 0h-2m2 0h2"/>
      </svg>
      Continue with a passkey
    </button>

    <!-- Divider -->
    <div class="divider flex items-center gap-3 my-5">
      <span class="text-xs text-muted uppercase tracking-widest">or</span>
    </div>

    <!-- Email form -->
    <form method="POST" action="/auth/login" autocomplete="on">
      <input type="hidden" name="_csrf" value="{{.CSRFToken}}" />
      <input type="hidden" name="rd" value="{{.Redirect}}" />

      <div class="mb-3">
        <input
          id="email"
          name="username"
          type="text"
          autocomplete="username"
          placeholder="Enter your email"
          required
          class="w-full bg-inputbg border border-border rounded-xl px-4 py-3 text-sm text-white placeholder-muted focus:border-primary transition-colors" />
      </div>

      {{if .Error}}
      <p class="mb-3 text-xs text-red-400 text-center">{{.Error}}</p>
      {{end}}

      <button
        type="submit"
        class="w-full bg-white text-black rounded-xl px-4 py-3 text-sm font-semibold hover:bg-gray-100 transition-colors">
        Continue with email
      </button>
    </form>

    <!-- Legal -->
    <p class="mt-5 text-center text-xs text-muted">
      By continuing, you acknowledge our
      <a href="/privacy" class="underline underline-offset-2 hover:text-white transition-colors">Privacy Policy</a>.
    </p>
  </div>

  <!-- ── Passkey WebAuthn script ─────────────────────── -->
  <script>
    async function startPasskeyAuth() {
      try {
        const optResp = await fetch('/auth/passkey/authenticate/begin', { method: 'POST' });
        if (!optResp.ok) throw new Error('Server error');
        const options = await optResp.json();

        // Decode base64url fields required by WebAuthn API
        options.publicKey.challenge = base64urlDecode(options.publicKey.challenge);
        if (options.publicKey.allowCredentials) {
          options.publicKey.allowCredentials = options.publicKey.allowCredentials.map(c => ({
            ...c, id: base64urlDecode(c.id)
          }));
        }

        const credential = await navigator.credentials.get(options);
        const body = {
          id: credential.id,
          rawId: base64urlEncode(credential.rawId),
          type: credential.type,
          response: {
            authenticatorData: base64urlEncode(credential.response.authenticatorData),
            clientDataJSON:    base64urlEncode(credential.response.clientDataJSON),
            signature:         base64urlEncode(credential.response.signature),
            userHandle:        credential.response.userHandle
              ? base64urlEncode(credential.response.userHandle) : null,
          },
        };

        const finResp = await fetch('/auth/passkey/authenticate/finish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (finResp.ok) {
          window.location = finResp.headers.get('X-Redirect') || '/';
        } else {
          const err = await finResp.text();
          showError(err || 'Passkey authentication failed');
        }
      } catch (e) {
        if (e.name !== 'NotAllowedError') showError('Passkey error: ' + e.message);
      }
    }

    function showError(msg) {
      let el = document.getElementById('passkey-err');
      if (!el) {
        el = document.createElement('p');
        el.id = 'passkey-err';
        el.className = 'mt-3 text-xs text-red-400 text-center';
        document.querySelector('.bg-surface').appendChild(el);
      }
      el.textContent = msg;
    }

    function base64urlDecode(str) {
      const b = str.replace(/-/g,'+').replace(/_/g,'/');
      const bin = atob(b); const buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      return buf.buffer;
    }
    function base64urlEncode(buf) {
      const bytes = new Uint8Array(buf);
      let str = '';
      bytes.forEach(b => str += String.fromCharCode(b));
      return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    }
  </script>
</body>
</html>
