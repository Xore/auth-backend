<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Two-factor — xore//auth</title>
  <link rel="stylesheet" href="/static/tailwind.min.css" />
  <link rel="stylesheet" href="/static/theme.css" />
  <style nonce="{{.Nonce}}">
    html { background: var(--app-bg); }
    body.auth-verify { background: var(--app-bg); color: var(--text-primary); }
    .verify-brand h1 { color: var(--text-primary); }
    .verify-card {
      background: var(--surface-1);
      border-color: var(--border-subtle);
      border-radius: var(--radius-panel);
      box-shadow: none;
    }
    .otp-box {
      width: 3rem; height: 3.5rem;
      background: var(--surface-0);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-control);
      text-align: center;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
      caret-color: var(--accent);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .otp-box:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }
    .verify-input {
      background: var(--surface-0);
      border-color: var(--border-subtle);
      border-radius: var(--radius-control);
      color: var(--text-primary);
    }
    .verify-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .verify-primary {
      background: var(--accent);
      border-radius: var(--radius-control);
      color: var(--text-on-accent);
    }
    .verify-primary:enabled:hover { background: var(--accent-hover); }
    input:focus { outline: none; }
  </style>
</head>
<body class="auth-verify h-full font-sans flex flex-col items-center justify-center px-4">

  <!-- Brand -->
  <div class="verify-brand mb-8 text-center select-none">
    <h1 class="font-serif text-4xl sm:text-5xl font-normal leading-tight">
      xore<span class="text-primary">//</span>auth
    </h1>
    <p class="mt-3 text-sm text-muted tracking-wide">one more step</p>
  </div>

  <!-- Card -->
  <div class="verify-card w-full max-w-sm border p-7 text-center">

    <!-- Shield icon -->
    <div class="flex justify-center mb-5">
      <svg class="w-12 h-12" viewBox="0 0 48 48" fill="none">
        <path d="M24 4L8 10v14c0 9.4 6.8 18.2 16 20 9.2-1.8 16-10.6 16-20V10L24 4z"
              stroke="#d4764e" stroke-width="2" fill="none"/>
        <path d="M16 24l5 5 11-11" stroke="#d4764e" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h2 class="text-lg font-semibold mb-1">Two-factor authentication</h2>
    <p class="text-sm text-muted mb-6" id="mode-desc">Enter the 6-digit code from your authenticator app</p>

    <form method="POST" action="/_auth/totp" class="mb-4">
      <input type="hidden" name="rd" value="{{.RD}}" />
      <input type="hidden" id="code-hidden" name="code" value="" />

      <!-- TOTP boxes -->
      <div class="flex justify-center gap-2 mb-5" id="otp-boxes">
        {{range $i := seq 6}}
        <input
          class="otp-box"
          type="text"
          inputmode="numeric"
          maxlength="1"
          pattern="[0-9]"
          autocomplete="one-time-code"
          aria-label="Digit {{add $i 1}}"
        />
        {{end}}
      </div>

      <!-- Backup code input (toggled) -->
      <div class="mb-5 hidden" id="backup-wrap">
        <input
          id="backup-input"
          type="text"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          placeholder="XXXX-XXXX"
          class="verify-input w-full border px-4 py-3
                 text-sm placeholder-muted transition-colors text-center" />
      </div>

      {{if .Error}}
      <p class="mb-3 text-xs text-red-400">{{.Error}}</p>
      {{end}}

      <button
        type="submit"
        id="code-submit"
        disabled
        class="verify-primary w-full px-4 py-3 text-sm font-semibold
               opacity-40 cursor-not-allowed transition-all
               enabled:opacity-100 enabled:cursor-pointer">
        Verify
      </button>
    </form>

    <!-- Alternative sign-in methods -->
    <div class="mt-2 flex flex-col gap-2 border-t border-border pt-4">
      <button
        type="button"
        id="toggle-backup"
        class="text-xs text-muted hover:text-white transition-colors underline underline-offset-2">
        Use a backup code instead
      </button>
      <a href="/_auth/login"
         class="text-xs text-muted hover:text-white transition-colors underline underline-offset-2">
        Use a passkey or a different account
      </a>
    </div>
  </div>

  <script nonce="{{.Nonce}}">
    (function () {
      var boxes   = document.querySelectorAll('.otp-box');
      var hidden  = document.getElementById('code-hidden');
      var submit  = document.getElementById('code-submit');
      var backup  = document.getElementById('backup-input');
      var backupMode = false;

      boxes.forEach(function (box, i) {
        box.addEventListener('input', function (e) {
          if (e.target.value.length > 1) {
            var digits = e.target.value.replace(/\D/g, '').slice(0, 6);
            digits.split('').forEach(function (d, j) { if (boxes[j]) boxes[j].value = d; });
            boxes[Math.min(5, digits.length - 1)].focus();
            sync(); return;
          }
          e.target.value = e.target.value.replace(/\D/g, '');
          if (e.target.value && i < 5) boxes[i + 1].focus();
          sync();
        });
        box.addEventListener('keydown', function (e) {
          if (e.key === 'Backspace' && !box.value && i > 0) boxes[i - 1].focus();
        });
      });

      backup.addEventListener('input', sync);

      function sync() {
        if (backupMode) {
          hidden.value = backup.value.trim();
          submit.disabled = hidden.value.length < 8;
          return;
        }
        var code = Array.from(boxes).map(function (b) { return b.value; }).join('');
        hidden.value = code;
        submit.disabled = code.length !== 6;
      }

      function toggleBackup() {
        backupMode = !backupMode;
        document.getElementById('otp-boxes').classList.toggle('hidden', backupMode);
        document.getElementById('backup-wrap').classList.toggle('hidden', !backupMode);
        document.getElementById('mode-desc').textContent = backupMode
          ? 'Enter one of your one-time backup codes'
          : 'Enter the 6-digit code from your authenticator app';
        document.getElementById('toggle-backup').textContent = backupMode
          ? 'Use an authenticator code instead'
          : 'Use a backup code instead';
        if (backupMode) { backup.focus(); } else { boxes[0].focus(); }
        sync();
      }
      document.getElementById('toggle-backup').addEventListener('click', toggleBackup);;
    })();
  </script>
</body>
</html>
