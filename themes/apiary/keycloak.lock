# Keycloak compatibility record (#101).
#
# This pins the exact upstream release this theme was validated against --
# not `main`, which is mutable and gives no compatibility guarantee for a
# CSS-only child theme that depends on keycloak.v2's DOM/class contract
# (template.ftl, page templates, theme.properties). A Keycloak upgrade is
# only "supported" once this file, and the checks in
# .github/scripts/verify-keycloak-compat.sh, are updated together with a
# full theme test pass -- see docs/THEME-GUIDE.md's "Keycloak upgrades"
# section.
#
# Checked by .github/workflows/theme.yml on every push/PR via
# .github/scripts/verify-keycloak-compat.sh, which re-fetches the pinned
# tag's own files from upstream and compares hashes -- not vendored/
# committed copies (README.md's "Do not put ... deployment scripts here"
# boundary, and #99's own "do not copy upstream CSS locally" acceptance
# criterion, both apply equally to not vendoring upstream FTL/CSS just to
# hash a local copy).

[keycloak]
# The exact image APIARY deploys (Xore/APIARY's Dockge-managed
# honeypot-keycloak stack) -- image tag plus content digest, not tag alone,
# since a tag can be re-pushed upstream.
image = quay.io/keycloak/keycloak:26.7.1
digest = sha256:f1f1f01e472c8a78df40d8f2a49a925274eda4d3d80d5f6edbb5c880ee3c01c6
# Matching keycloak/keycloak git tag and its resolved commit, for fetching
# the exact theme source tree the digest above was built from.
git_tag = 26.7.1
git_commit = 73f08b397f193712b26d317210dce99898129709

[upstream_files]
# sha256 of each file as of git_tag above, fetched fresh at CI time from
# https://raw.githubusercontent.com/keycloak/keycloak/<git_tag>/themes/src/main/resources/theme/keycloak.v2/login/<path>
theme.properties = f5032f39aabb1e0dc940564937263fb0dfb99c534ec0a1f92dea6c4baf0e03e2
template.ftl = 6221a3176c73a3fd67abc97076deb9cef112378ce157735a78bd865800315b37
resources/css/styles.css = 922d21115fe10855a9652cd8c234cf0f78e72de0c55ec7c7bf790fb5bd0f042c

[required_dom_hooks]
# Every upstream ID/class login.css depends on (extracted from the
# selectors in themes/apiary/login/resources/css/login.css). Not an
# exhaustive list of everything template.ftl renders -- only what this
# theme's own CSS reaches into. Re-derive with:
#   grep -oE '#[a-zA-Z][a-zA-Z0-9_-]*|\.pf-v5-c-[a-zA-Z0-9_-]*(__[a-zA-Z0-9_-]+)?' \
#     themes/apiary/login/resources/css/login.css | sort -u
hooks = #kc-form-options, #kc-header, #kc-header-wrapper, #kc-info-wrapper,
        #kc-page-title, #kc-registration, #kc-social-providers,
        #kc-totp-secret-key, #kc-totp-secret-qr-code, #kc-totp-settings,
        #kc-totp-supported-apps, #keycloak-bg,
        .pf-v5-c-alert, .pf-v5-c-button, .pf-v5-c-check__label, .pf-v5-c-form,
        .pf-v5-c-form-control, .pf-v5-c-form__group, .pf-v5-c-form__helper-text,
        .pf-v5-c-form__label, .pf-v5-c-helper-text, .pf-v5-c-helper-text__item,
        .pf-v5-c-input-group, .pf-v5-c-login, .pf-v5-c-login__container,
        .pf-v5-c-login__main, .pf-v5-c-login__main-body,
        .pf-v5-c-login__main-footer, .pf-v5-c-login__main-header

[javascript_compatibility]
# Populated once #103 (Xore auth interaction layer) actually ships local
# JavaScript -- there is nothing to hash yet. When it lands this section
# must record: vendored Xore JS hashes/provenance, any Keycloak bridge
# module, theme.properties' scripts= order/attributes, and every upstream
# DOM ID/class/data hook, built-in module, form field, and event behavior
# the interaction layer depends on (password visibility, WebAuthn,
# conditional passkey, session-polling, submit-protection scripts).
status = not-yet-applicable

[historical_reference_provenance]
# Visual/interaction parity baseline (#104) -- independent of the runtime
# compatibility pins above. Not a dependency to copy retired Go
# authentication logic from (auth-backend#104's own Non-goals).
auth_backend_commit = 3c2779a8ca03f9d6df6ba5bba0a263131a514c2b
xore_theme_pin = e150f6b9188c0a84d397c12419e3bc75df627da7
source_templates = forward-auth/ui/login.html, forward-auth/ui/verify.html
viewport_contract = 1440x900, 820x1180, 390x844, 393x852, 1920x1080, 3840x2160

[screenshot_baseline]
# Last completed full visual regression baseline against the pinned
# release above. Set by #102 once that lands; empty until then.
completed = false
