<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="APIARY">
  <!-- #91: single file masthead brand mark. Header.tsx only exposes one
       theme.properties `logo=` path: there is no separate dark/light key
       the way this project's own dashboard handles it, via two <img>
       elements and its ".theme-art" light/dark display toggling
       (theme/theme.css). That trick needs two real DOM elements; the
       account console masthead only ever renders one <img>. This SVG is
       the equivalent for a single <img> src: two <image> refs, toggled by
       the same prefers-color-scheme signal Keycloak's own index.ftl uses
       to decide pf-v5-theme-dark (confirmed: keycloak.v3/account/theme.properties
       has darkMode=true with no separate manual toggle UI in ui-shared's
       Masthead/KeycloakDropdown; OS preference is the only signal there
       is). If a user's browser diverges from the app's own resolved theme,
       the mark won't perfectly match; that's an accepted, documented
       limitation of Keycloak's single logo property masthead, not
       something CSS alone can fix here.

       The two source PNGs (apiary-compact-mark-for-dark/light.png, kept
       alongside this file for provenance and re-export) are inlined below
       as base64 data URIs rather than referenced by relative <image href>.
       Confirmed live: a browser rendering an SVG as an <img> src treats it
       as a restricted "image context" that silently drops fetches for any
       external subresource the SVG itself references, no request even
       fires, so a relative href version of this file loaded but rendered
       blank (img.naturalWidth/Height both 0 despite the SVG request itself
       succeeding). Inlining is the actual fix, not a stylistic choice.

       Note for future edits: this is XML, not CSS/JS. A literal double
       hyphen inside this comment breaks the parse (silently, as a fully
       blank masthead image with no console error), learned the hard way
       building this file; do not reintroduce one. -->
  <style>
    .apiary-mark-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .apiary-mark-light { display: none; }
      .apiary-mark-dark { display: inline; }
    }
  </style>
  <image class="apiary-mark-light" href="data:image/png;base64," width="64" height="64"/>
  <image class="apiary-mark-dark" href="data:image/png;base64," width="64" height="64"/>
</svg>
