# Local patch (#102): upstream's theme.min.css opens with
# `@import url("https://fonts.googleapis.com/...")`, pulling the Fira Sans/
# Space Grotesk/Fira Code webfonts from Google's CDN on every login page
# load -- a real violation of this repo's own "Assets must work without a
# CDN or runtime network fetch" deployment contract (docs/THEME-GUIDE.md),
# and a genuine privacy leak (every visitor's IP reaches Google before
# they've authenticated to anything). Found live by #102's own
# no-external-requests test, not by static review.
#
# The @import statement has been stripped from the committed
# xore-theme.css below (nothing else changed -- verified brace-balanced
# and byte-identical past the import). Text falls back to each font
# stack's next entries (system-ui/"Segoe UI" for sans, etc.) instead of
# the exact custom webfaces; that's an accepted degradation until the
# fonts are actually self-hosted (real follow-up work, not done here).
#
# upstream_sha256 is the pristine file at the commit above, for
# provenance/drift-tracking against a future re-sync; sha256 is what's
# actually committed here and what CI's "Verify pinned Xore theme"
# step checks against -- re-run the same @import-stripping process after
# any future re-sync from upstream, don't just copy the new file in raw.
